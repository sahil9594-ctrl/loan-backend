<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #22c55e;
      color: white;
    }

    .reject {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<h1>Admin Loan Applications</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>User ID</th>
      <th>Amount</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="loanTableBody"></tbody>
</table>

<script>
async function loadLoans() {
  const res = await fetch("http://localhost:3000/admin/loans");
  const loans = await res.json();

  const table = document.getElementById("loanTableBody");
  table.innerHTML = "";

  loans.forEach(loan => {
    table.innerHTML += `
      <tr>
        <td>${loan.id}</td>
        <td>${loan.user_id}</td>
        <td>₹${loan.amount}</td>
        <td>${loan.status}</td>
        <td>
          <button class="approve" onclick="updateLoan(${loan.id}, 'Approved')">Approve</button>
          <button class="reject" onclick="updateLoan(${loan.id}, 'Rejected')">Reject</button>
        </td>
      </tr>
    `;
  });
}

async function updateLoan(id, status) {
  await fetch("http://localhost:3000/admin/update-loan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, status })
  });

  loadLoans();
}

loadLoans();
</script>

</body>
</html>
